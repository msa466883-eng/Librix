<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kutub Cloud</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <!-- Font Awesome 6 (FREE) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ==================== LOGIN SCREEN ==================== -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="login-icon">
                <i class="fas fa-cloud"></i>
            </div>
            <h1>Kutub Cloud</h1>
            <p class="login-sub">Islamic Digital Library</p>
            <form id="loginForm">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="loginUsername" placeholder="Username" required />
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Password" required />
                </div>
                <button type="submit" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <p id="loginError" class="error-text"></p>
            </form>
        </div>
    </div>

    <!-- ==================== DASHBOARD ==================== -->
    <div id="appScreen" class="app-screen hidden">

        <!-- TOP BAR -->
        <header class="top-bar">
            <div class="logo">
                <i class="fas fa-cloud"></i>
                <span>Kutub Cloud</span>
            </div>
            <div class="header-actions">
                <span id="userDisplay" class="user-badge">
                    <i class="fas fa-user-circle"></i> <span id="usernameDisplay">admin</span>
                </span>
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <!-- ========== STATS DASHBOARD (NEW) ========== -->
        <section class="stats-bar">
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fas fa-book"></i></div>
                <div class="stat-info">
                    <span class="stat-number" id="statBooks">0</span>
                    <span class="stat-label">Total Books</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fas fa-folder"></i></div>
                <div class="stat-info">
                    <span class="stat-number" id="statFolders">0</span>
                    <span class="stat-label">Folders</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple"><i class="fas fa-database"></i></div>
                <div class="stat-info">
                    <span class="stat-number" id="statStorage">0 MB</span>
                    <span class="stat-label">Storage Used</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange"><i class="fas fa-users"></i></div>
                <div class="stat-info">
                    <span class="stat-number" id="statSessions">1</span>
                    <span class="stat-label">Active Sessions</span>
                </div>
            </div>
        </section>

        <!-- TOOLBAR -->
        <div class="toolbar">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search books..." />
            </div>
            <button id="newFolderBtn" class="btn btn-outline">
                <i class="fas fa-folder-plus"></i> New Folder
            </button>
            <button id="uploadBtn" class="btn btn-primary">
                <i class="fas fa-upload"></i> Upload PDF
            </button>
        </div>

        <!-- FOLDER / FILE GRID -->
        <div id="contentGrid" class="content-grid">
            <!-- JS dynamically renders items here -->
        </div>
    </div>

    <!-- ========== MODALS ========== -->
    <!-- New Folder Modal -->
    <div id="folderModal" class="modal hidden">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3><i class="fas fa-folder-plus"></i> New Folder</h3>
            <input type="text" id="folderNameInput" placeholder="Folder name..." />
            <button id="createFolderBtn" class="btn btn-primary">Create</button>
        </div>
    </div>

    <!-- PDF Viewer Modal -->
    <div id="pdfModal" class="modal hidden">
        <div class="modal-content modal-pdf">
            <span class="modal-close">&times;</span>
            <iframe id="pdfFrame" src=""></iframe>
        </div>
    </div>

    <!-- Rename Modal -->
    <div id="renameModal" class="modal hidden">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3><i class="fas fa-pen"></i> Rename</h3>
            <input type="text" id="renameInput" placeholder="New name..." />
            <button id="renameConfirmBtn" class="btn btn-primary">Save</button>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
